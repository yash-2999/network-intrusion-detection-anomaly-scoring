<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Network Intrusion Detection &amp; Anomaly Scoring</title>
  <desc id="d">Machine Learning-Based Network Threat Detection</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070f21"/>
      <stop offset="0.6" stop-color="#0b1d3d"/>
      <stop offset="1" stop-color="#0f2f66"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d3d73" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Shield mark -->
  <g transform="translate(70,62)">
    <path d="M70 0 L140 26 V92 C140 146 108 178 70 194 C32 178 0 146 0 92 V26 Z"
          fill="#0a1a38" stroke="url(#accent)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M24 98 H52 L62 66 L80 128 L92 98 H116"
          fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="250" y="122" font-size="48" font-weight="700" fill="#e8f1ff">Network Intrusion Detection</text>
    <text x="250" y="178" font-size="48" font-weight="700" fill="#e8f1ff">&amp; Anomaly Scoring</text>
    <text x="250" y="222" font-size="23" fill="#7fb2ff">Machine Learning-Based Network Threat Detection</text>
    <text x="250" y="262" font-size="13" letter-spacing="2" fill="#5f84b8">ISOLATION FOREST  ·  PCA RECONSTRUCTION ERROR  ·  CIC-IDS2017</text>
  </g>

  <!-- Network graph (decorative): one node stands out as the anomaly -->
  <g stroke="#2f5fa8" stroke-width="2" stroke-opacity="0.8" fill="none">
    <line x1="1000" y1="90" x2="1085" y2="140"/>
    <line x1="1085" y1="140" x2="1180" y2="95"/>
    <line x1="1085" y1="140" x2="1060" y2="230"/>
    <line x1="1060" y1="230" x2="1170" y2="215"/>
    <line x1="1180" y1="95" x2="1215" y2="170"/>
    <line x1="1085" y1="140" x2="1215" y2="170"/>
    <line x1="1215" y1="170" x2="1170" y2="215"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="1000" cy="90" r="9"/>
    <circle cx="1085" cy="140" r="12"/>
    <circle cx="1180" cy="95" r="9"/>
    <circle cx="1060" cy="230" r="9"/>
    <circle cx="1215" cy="170" r="9"/>
  </g>
  <circle cx="1170" cy="215" r="20" fill="none" stroke="#ff6b4a" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="1170" cy="215" r="10" fill="#ff6b4a"/>

  <rect y="316" width="1280" height="4" fill="url(#accent)"/>
</svg>
